plugins {
    id 'com.android.application'
}

apply plugin: 'com.chaquo.python'

android {
    namespace 'com.app.myplayer'
    compileSdk 33

    useLibrary 'org.apache.http.legacy'

// Untuk AGP versi baru (7.0+)
	androidResources {
		noCompress 'tar', 'gz', 'tgz', 'tar.gz'
	}

	// Atau jika menggunakan AGP versi lama
	//aaptOptions {
	//	noCompress 'tar', 'gz', 'tgz', 'tar.gz'
	//}

    defaultConfig {
        applicationId "com.app.myplayer"
        minSdk 24
        targetSdk 33

        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

		sourceSets {
			main {
				setRoot "src/main"

				python {
					srcDirs = ["src/main/python"]
				}
			}
		}

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

		python {
			version "3.10"

			buildPython "C:\\Program Files\\Python310\\python.exe"

			pip {
				install "streamlink"
				install "certifi"
				install "exceptiongroup"
				install "isodate"
				install "lxml==5.3.0"
				install "pycountry"
				install "pycryptodome"
				install "PySocks"
				install "requests"
				install "trio"
				install "trio-websocket"
				install "typing-extensions"
				install "urllib3"
				install "websocket-client"
			}
		}
    }

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile(
					'proguard-android-optimize.txt'
			), 'proguard-rules.pro'
		}
	}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar']
    )

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "androidx.media3:media3-exoplayer:1.0.1"
    implementation "androidx.media3:media3-ui:1.0.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.0.1"
	implementation "androidx.media3:media3-session:1.0.1"

    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
	implementation 'com.google.firebase:firebase-database:20.0.4'

	testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
